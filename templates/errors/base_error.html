{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Error{% endblock %} · HRMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>(function(){try{if(localStorage.getItem('hrms.theme')==='dark')document.documentElement.classList.add('dark');}catch(e){}})();</script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <main class="relative flex min-h-screen items-center justify-center overflow-hidden px-6 py-16">
    <div class="pointer-events-none absolute inset-0">
      <div class="absolute -left-24 -top-24 h-96 w-96 rounded-full bg-violet-500/20 blur-3xl"></div>
      <div class="absolute -bottom-24 -right-24 h-96 w-96 rounded-full bg-indigo-500/20 blur-3xl"></div>
    </div>

    <div class="relative w-full max-w-xl text-center">
      <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-2xl bg-gradient-to-br from-violet-600 to-indigo-600 text-white shadow-lg shadow-violet-600/30">
        <i data-lucide="{% block icon %}compass{% endblock %}" class="h-8 w-8"></i>
      </div>

      <p class="bg-gradient-to-br from-violet-600 to-indigo-600 bg-clip-text text-7xl font-extrabold tracking-tight text-transparent sm:text-8xl">{% block error_code %}404{% endblock %}</p>
      <h1 class="mt-4 text-2xl font-bold sm:text-3xl">{% block error_title %}Page not found{% endblock %}</h1>
      <p class="mx-auto mt-3 max-w-md text-sm leading-relaxed text-slate-500 dark:text-slate-400">{% block error_message %}The page you're looking for doesn't exist.{% endblock %}</p>

      <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
        <a href="/dashboard/" class="inline-flex items-center gap-2 rounded-xl bg-violet-600 px-5 py-2.5 text-sm font-semibold text-white shadow-md shadow-violet-600/30 transition hover:bg-violet-500">
          <i data-lucide="layout-dashboard" class="h-4 w-4"></i> Go to dashboard
        </a>
        <button type="button"
                onclick="if(history.length>1){history.back()}else{location.href='/'}"
                class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 dark:border-white/10 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-white/5">
          <i data-lucide="arrow-left" class="h-4 w-4"></i> Go back
        </button>
      </div>

      <p class="mt-10 text-xs font-semibold uppercase tracking-widest text-slate-400">HRMS Suite</p>
    </div>
  </main>
  <script>window.lucide && lucide.createIcons();</script>
</body>
</html>
