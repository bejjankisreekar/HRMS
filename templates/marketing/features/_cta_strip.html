<section class="hrms-section hrms-feat-cta" aria-labelledby="feat-cta-heading">
  <div class="hrms-container">
    <div class="hrms-feat-cta__grid hrms-reveal">
      <div class="hrms-feat-cta__card hrms-feat-cta__card--primary">
        <i data-lucide="rocket" class="h-8 w-8"></i>
        <h3>Start free trial</h3>
        <p>14 days full access. No credit card required.</p>
        <a href="{% url 'accounts:register' %}" class="hrms-btn hrms-btn--white">Get started</a>
      </div>
      <div class="hrms-feat-cta__card">
        <i data-lucide="calendar" class="h-8 w-8 text-violet-400"></i>
        <h3>Request demo</h3>
        <p>See HRMS Suite tailored to your organization.</p>
        <button type="button" class="hrms-btn hrms-btn--outline" data-demo-open>Book demo</button>
      </div>
      <div class="hrms-feat-cta__card">
        <i data-lucide="headphones" class="h-8 w-8 text-cyan-400"></i>
        <h3>Contact sales</h3>
        <p>{{ plan_names.growth }} plan, custom integrations, and migration.</p>
        <a href="{% url 'accounts:contact' %}" class="hrms-btn hrms-btn--outline">Talk to us</a>
      </div>
    </div>
  </div>
</section>
