<div id="demo-modal" class="hrms-modal hidden" role="dialog" aria-modal="true" aria-labelledby="demo-modal-title" aria-hidden="true">
  <div class="hrms-modal__backdrop" data-demo-close></div>
  <div class="hrms-modal__panel">
    <div class="hrms-modal__header">
      <h2 id="demo-modal-title" class="text-lg font-bold text-slate-900">Book a demo</h2>
      <button type="button" class="hrms-modal__close" data-demo-close aria-label="Close">
        <i data-lucide="x" class="h-5 w-5"></i>
      </button>
    </div>
    <p class="mt-2 text-sm text-slate-600">See HRMS Suite in action. Our team will reach out within 24 hours.</p>
    <form class="mt-6 space-y-4" action="{% url 'accounts:contact' %}" method="get">
      <div>
        <label for="demo-name" class="mb-1 block text-xs font-semibold text-slate-600">Full name</label>
        <input id="demo-name" name="name" type="text" required class="hrms-input" placeholder="Jane Smith">
      </div>
      <div>
        <label for="demo-email" class="mb-1 block text-xs font-semibold text-slate-600">Work email</label>
        <input id="demo-email" name="email" type="email" required class="hrms-input" placeholder="you@company.com">
      </div>
      <div>
        <label for="demo-company" class="mb-1 block text-xs font-semibold text-slate-600">Company</label>
        <input id="demo-company" name="company" type="text" class="hrms-input" placeholder="Acme Corp">
      </div>
      <button type="submit" class="hrms-btn hrms-btn--primary w-full">Request demo</button>
    </form>
  </div>
</div>
