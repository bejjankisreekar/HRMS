{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}HRMS{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Ensure theme is applied before paint (dashboard.js also toggles later)
      (function () {
        try {
          var theme = localStorage.getItem("hrms.theme");
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{% static 'app.css' %}">
    <link rel="stylesheet" href="{% static 'dashboard-shell.css' %}">
    <link rel="stylesheet" href="{% static 'toasts.css' %}">
    {% block extra_head %}{% endblock %}
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    {% include "includes/_messages_toast.html" %}

    {% block body %}
    {% endblock %}

    <script src="{% static 'toasts.js' %}"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
