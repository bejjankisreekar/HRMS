<section class="pro-productivity" aria-label="Productivity dashboard">
  <h2 class="pro-section-title">Productivity</h2>
  <div class="pro-chart-grid pro-chart-grid--3">
    <article class="pro-card">
      <h3>Team productivity index</h3>
      <div class="pro-chart"><canvas id="pro-chart-productivity"></canvas></div>
    </article>
    <article class="pro-card">
      <h3>Timesheet hours</h3>
      <div class="pro-chart"><canvas id="pro-chart-timesheet"></canvas></div>
    </article>
    <article class="pro-card">
      <h3>Task completion</h3>
      <div class="pro-empty pro-empty--compact">
        <i data-lucide="check-square"></i>
        <p>Projects module coming soon — track tasks and deliverables here.</p>
      </div>
    </article>
  </div>
</section>
