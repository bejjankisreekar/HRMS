{% extends "dashboard/feature_control/_base.html" %}
{% block fcc_content %}
<section class="fin-panel">
  <div class="fin-panel__head"><h2 class="fin-panel__title">Workflow control</h2></div>
  <div class="fcc-toggle-grid">
    {% for wf in workflows %}
    <label class="fcc-toggle-row">
      <span><strong>{{ wf.name }}</strong> <code>{{ wf.key }}</code></span>
      <input type="checkbox" class="fcc-switch fcc-global-toggle" data-feature-id="{{ wf.pk }}"{% if wf.is_globally_enabled %} checked{% endif %}>
    </label>
    {% empty %}
    <p class="fin-muted">No workflow features seeded.</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
